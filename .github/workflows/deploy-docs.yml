name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/documentation/**'
      - .github/workflows/deploy-docs.yml
  # A finished E2E run on `main` carries a fresh Playwright report. Re-deploy so
  # /grocery/e2e/ tracks the latest run even when the docs themselves did not change.
  workflow_run:
    workflows: ['E2E 🎭']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# One Pages site for the repo: this workflow is its only deployer. The docs site sits at
# the root, the Playwright report is bundled in at /e2e/ (see the build job).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # `workflow_run` fires even when E2E failed; only a green docs build should deploy.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24.13.0
          pnpm-version: 10.28.2

      - name: Install dependencies
        run: pnpm install

      - name: Build the docs site
        run: pnpm --filter @grocery/documentation build

      # The Playwright report is a self-contained static site (relative paths). Serve it
      # under /grocery/e2e/ by dropping it into the docs build output. Best-effort: on the
      # first run (no successful E2E on `main` yet, or the artifact expired) the docs
      # deploy without it, and the next E2E run brings it back.
      - name: Add the latest Playwright report at /e2e/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow e2e.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run_id" ]; then
            if gh run download "$run_id" --name playwright-report \
              --dir apps/documentation/dist/e2e; then
              echo "Bundled the report from E2E run $run_id"
            else
              echo "E2E run $run_id has no playwright-report artifact (expired?)"
            fi
          else
            echo "No successful E2E run on main yet — deploying docs without /e2e/"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/documentation/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
