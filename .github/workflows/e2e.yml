name: E2E 🎭

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-spa-e2e:
    name: 🎭 web-spa e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24.13.0
          pnpm-version: 10.28.2

      - name: 📚 Install dependencies
        run: pnpm install

      - name: 🌐 Install Playwright browser
        run: pnpm --filter @grocery/web-spa-e2e exec playwright install --with-deps chromium

      # `pnpm e2e` starts the disposable infra (docker-compose.e2e.yml: Postgres :5433,
      # maildev :1080/:1025), recreates + seeds the DB, boots the API + SPA via Playwright's
      # webServer (reuseExistingServer is false when CI=true) and runs the specs.
      - name: 🎭 Run e2e
        run: pnpm e2e
        env:
          CI: true

      - name: 📤 Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web-spa-e2e/playwright-report/
          retention-days: 7
