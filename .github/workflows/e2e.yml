name: E2E 🎭

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-spa-e2e:
    name: 🎭 web-spa e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24.13.0
          pnpm-version: 10.28.2

      - name: 📚 Install dependencies
        run: pnpm install

      - name: 🌐 Install Playwright browser
        run: pnpm --filter @grocery/web-spa-e2e exec playwright install --with-deps chromium

      # `pnpm e2e` starts the disposable infra (docker-compose.e2e.yml: Postgres :5434,
      # maildev :1090/:1035), recreates + seeds the DB, boots the API + SPA via Playwright's
      # webServer (reuseExistingServer is false when CI=true) and runs the specs.
      - name: 🎭 Run e2e
        run: pnpm e2e
        env:
          CI: true

      - name: 🔎 Did the run produce a report?
        id: report
        if: ${{ !cancelled() }}
        run: |
          if [ -f apps/web-spa-e2e/playwright-report/index.html ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # The report is published to GitHub Pages by `deploy-docs.yml` (its only Pages
      # deployer), which picks up this artifact on a `workflow_run` after each E2E run on
      # `main` and serves it at https://tatiana-grange.github.io/grocery/e2e/. On a PR the
      # artifact is the only way to read it.
      - name: 📤 Upload Playwright report
        if: ${{ !cancelled() && steps.report.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web-spa-e2e/playwright-report/
          retention-days: 7

      - name: 🔗 Report location
        if: ${{ !cancelled() && steps.report.outputs.ready == 'true' }}
        run: |
          {
            echo "### 🎭 Playwright report"
            echo ""
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "Publishing to <https://tatiana-grange.github.io/grocery/e2e/> via the docs deploy."
            else
              echo "Download the \`playwright-report\` artifact from this run and open \`index.html\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
